<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <div class="game-title">
      Memory Game
    </div>

    <h1>Memory Game</h1>

    <p class="sub">
      Remember the pattern and repeat it.
    </p>

    <div class="seq-box">
      <span class="seq" id="seq">
        · · · · ·
      </span>
    </div>

    <button class="start-btn" id="startBtn">
      Start Game
    </button>

    <button class="resign-btn" id="resignBtn">
      Give Up
    </button>

    <div class="opts" id="opts"></div>

    <div class="timer-row" id="timerRow">

      <div class="track">
        <div class="fill" id="bar" style="width:100%"></div>
      </div>

      <span id="tnum">20</span>

    </div>

    <p class="msg" id="msg">
      Press Start To Play
    </p>

    <div class="footer">

      <div>
        <p>Score</p>
        <h2 id="scoreEl">0</h2>
      </div>

      <div>

        <p>Lives</p>

        <div class="dots" id="dotsEl">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
